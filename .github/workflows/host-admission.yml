name: Host admission contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  host-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 scripts/test-backend-checker.py -v
      - name: Verify generated-artifact parser contract self-tests
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/rpc-verification"
          "$RUNNER_TEMP/rpc-verification/bin/python" -m pip install --disable-pip-version-check 'jsonschema==4.26.0'
          "$RUNNER_TEMP/rpc-verification/bin/python" -m unittest discover -s tests -p 'test_*.py' -v
          bash -n scripts/export-contracts.sh
